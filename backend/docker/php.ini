; Konfigurasi PHP runtime container LPTI-ISBN.
; Salin ke /usr/local/etc/php/conf.d/ (lihat Dockerfile).

; Batas unggah — selaras dengan batas persyaratan dokumen (4 MB).
; Sengaja 8M (bukan 4M) agar kepala multipart ikut terhitung; batas otoritatif
; tetap di validasi Laravel + limit server action Next.js (4,2 MB) dan
; platform Vercel (4,5 MB).
upload_max_filesize = 8M
post_max_size = 8M

memory_limit = 256M
max_execution_time = 120
expose_php = Off
